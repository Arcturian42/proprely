<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2D5E"/>
      <stop offset="100%" style="stop-color:#1A4FAF"/>
    </linearGradient>
  </defs>

  <!-- Icon: Stylized P with checkmark -->
  <g transform="translate(15, 15)">
    <!-- Circle background -->
    <circle cx="45" cy="45" r="42" fill="url(#brandGradient)"/>

    <!-- White P letter -->
    <path d="M30 65 L30 22 L48 22 Q58 22 58 33 Q58 44 48 44 L38 44 L38 65 Z" 
          fill="white"/>
    <rect x="38" y="40" width="10" height="5" fill="white" rx="1"/>

    <!-- Checkmark overlay -->
    <path d="M48 48 L55 58 L72 32" 
          stroke="#00C2E0" stroke-width="5" fill="none" 
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: Proprely -->
  <g transform="translate(115, 72)">
    <!-- P -->
    <text x="0" y="0" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="52" font-weight="700" fill="#0F2D5E" letter-spacing="-1">P</text>
    <!-- roprely -->
    <text x="32" y="0" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" 
          font-size="52" font-weight="400" fill="#0F2D5E" letter-spacing="-1">roprely</text>

    <!-- Accent dot on the 'y' tail -->
    <circle cx="216" cy="-35" r="5" fill="#00C2E0"/>
  </g>

  <!-- Tagline -->
  <text x="147" y="95" font-family="'Montserrat', 'Segoe UI', Arial, sans-serif" 
        font-size="13" font-weight="400" fill="#5A6B7D" letter-spacing="2">LOGICIEL DE GESTION</text>
</svg>